[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "showme-experiment"
version = "0.1.0"
description = "Offline-first video experiment harness for SHOWME"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
meta = ["openai>=1.0.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "python-multipart>=0.0.22"]

[project.scripts]
thread-discover = "thread_engine.cli:main"
showme = "showme.cli:main"
thread-evaluate = "thread_engine.evaluate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["thread_engine*", "showme*"]
