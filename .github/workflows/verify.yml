name: Verify CONTEXT

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install media and application dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r backend/requirements-dev.txt
          npm ci --prefix web
      - name: Check Python and frontend formatting
        run: |
          ruff check backend scripts
          ruff format --check backend scripts
          npm --prefix web run format:check
      - name: Test deterministic analysis and API
        run: python -m pytest -q
      - name: Build production frontend
        run: npm run build --prefix web
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Start local application
        run: |
          python -m uvicorn context_core.api:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/context-api.log 2>&1 &
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/api/health
      - name: Verify real browser workflows
        run: npm --prefix web run test:e2e
      - name: Print API diagnostics on failure
        if: failure()
        run: cat /tmp/context-api.log 2>/dev/null || true
